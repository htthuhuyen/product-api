name: Docker Hub CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run basic test
        run: npm run test:basic

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest .

      - name: Run container for healthcheck
        run: |
          docker network create product-ci-network
          docker run -d \
            --name mongo-ci \
            --network product-ci-network \
            mongo:8
          docker run -d \
            --name product-api-ci \
            --network product-ci-network \
            -p 3000:3000 \
            -e PORT=3000 \
            -e MONGO_URI=mongodb://mongo-ci:27017/productdb \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest

      - name: Wait for containers
        run: sleep 15

      - name: Check Product API health
        run: |
          curl --fail http://localhost:3000/health

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest